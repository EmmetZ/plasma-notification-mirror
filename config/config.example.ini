[General]

# Where mirrored notifications should appear.
# secondary      = first enabled non-primary monitor
# all-secondary  = every enabled non-primary monitor (default)
# screens        = only monitors listed in screens=
# The primary monitor is always excluded, even if listed in screens=.
# Legacy all is an alias for all-secondary; primary selects no targets.
mode=all-secondary

# Used only when mode=screens.
# No fallback to unlisted monitors when configured screens are unavailable.
# Comma-separated QScreen names, for example:
# screens=DP-2,DP-3
screens=

# Popup corner:
# top-left
# top-right
# bottom-left
# bottom-right
position=bottom-right

# Popup lifetime in milliseconds.
lifetime_ms=5000

# Popup width in pixels.
width=332

# Maximum simultaneous mirrored notifications per target monitor.
max_notifications=5

# Popup background opacity, from 0 (transparent) to 100 (opaque).
background_opacity=100

# Margins from the selected screen edges in pixels.
# Only the margins relevant to the selected corner are used.
left_margin=18
right_margin=18
top_margin=18
bottom_margin=58

# Gap between stacked notifications in pixels.
gap=12

# Per-screen popup overrides. Unspecified values inherit [General].
# Use exact names from kscreen-doctor -o, and restart the service after editing.
# All popup options above and enabled can be overridden here.
# mode and screens remain global; a section does not add an unselected target.

[Screen:HDMI-A-1]
position=bottom-left
left_margin=40
bottom_margin=88
width=400
lifetime_ms=8000
max_notifications=6
background_opacity=90
gap=18

[Screen:DP-2]
position=top-right
top_margin=32
right_margin=24
width=300
max_notifications=3

# Uncomment to disable mirroring on a particular screen:
# [Screen:DP-3]
# enabled=false
