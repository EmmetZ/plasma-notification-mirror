[General]
# Mirror all enabled non-primary displays. The primary is always excluded.
# Other modes: secondary (first enabled secondary), screens (explicit list).
mode=all-secondary
# For mode=screens only; missing screens wait for reconnect, without fallback.
# screens=DP-2,DP-3

# Positioning: grid (default, nine positions with auto-centering) or
# margin (original four corners; horizontal/vertical margins control placement).
# May be overridden in each Screen section, independently of monitor mode above.
position_mode=grid

# Nine grid positions:
# top-left      top-center      top-right
# center-left   center          center-right
# bottom-left   bottom-center   bottom-right
position=bottom-right

# Every setting is optional. Common margin, then optional edge overrides.
# In grid mode, centered axes ignore their edge margins.
margin=18
bottom_margin=58

# Optional popup settings (built-in defaults shown):
# lifetime_ms=5000
# width=332
# max_notifications=5
# background_opacity=100
# gap=12

# Per-screen overrides inherit [General]. Use names from kscreen-doctor -o.
# Restart the service after editing. mode and screens are global only.
[Screen:HDMI-A-1]
# Horizontal centering is automatic; no left/right margins are needed.
position=bottom-center
bottom_margin=88
width=400

[Screen:DP-2]
# Entire stack centered vertically; no top/bottom margins are needed.
position=center-left
margin=24

# To disable one display:
# [Screen:DP-3]
# enabled=false

# Original manual placement (replace that screen's position settings):
# position_mode=margin
# position=bottom-left
# left_margin=1118
# bottom_margin=88
# Margin mode accepts only top-left/top-right/bottom-left/bottom-right.
